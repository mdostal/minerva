id: completeness-pass
epic: agent-drivable-core
title: Completeness pass — error-enum coverage, concurrency proof, REQ-07 traceability marker
status: shipped
shipped_at: "2026-07-26T06:35:00Z"
release_id: "minerva-v0.1.1"
complexity: low
methodology: tdd
depends_on: [cleanup-ledger-events]

description: |
  Close out the epic: ensure `listRuns` is accurate across many concurrent runs, every closed
  error-enum branch (NOT_FOUND, WRONG_CHANNEL, NOT_READY, UNKNOWN_METHOD, VALIDATION_FAILED)
  has explicit test coverage, and the PRD's own anchored success metric (>=3 concurrent runs,
  zero hand-run commands per idea) is exercised directly rather than left as an inference from
  individual story tests. Document whichever outcome question-extraction and
  escalation-classification's checkpoints actually produced (converged, or fell back — either
  is valid) explicitly in `docs/architecture.md` if those stories' own documentation steps
  didn't already fully capture it. This is vertical-plan.md's Slice 8 — verification and
  documentation, not new capability.

acceptance_criteria:
  - "Given 3 concurrent runs started against 3 different scratch repos, when all three are driven to completion via bin/minerva, then all three reach status: complete with no cross-run interference — directly exercising the PRD's anchored >=3-concurrent success metric"
  - "Given each of the 5 closed error codes (NOT_FOUND, WRONG_CHANNEL, NOT_READY, UNKNOWN_METHOD, VALIDATION_FAILED), when its triggering condition is exercised, then it has explicit, passing test coverage — not just incidental coverage from other stories' tests"
  - "Given listRuns is called while several runs are in different states (in_progress, waiting_on_human, complete, aborted), when the result is inspected, then every run's reported status is accurate"
  - "Given REQ-07 (local CLI convenience wrapper) is not built by this epic, when Phase C traceability is reviewed, then it carries an explicit 'deferred' marker in epic.yaml / the traceability record — not silent absence"
  - "Given question-extraction and escalation-classification's actual checkpoint outcomes, when this story closes, then docs/architecture.md accurately reflects the as-built behavior for both (whichever outcome each landed on)"

scope_boundaries:
  do:
    - "Add missing test coverage, fix bugs the concurrency/error-enum tests reveal, and reconcile docs/architecture.md with as-built reality"
  do_not:
    - "Do not add new capabilities or API methods — if a real feature gap is discovered here, scope it as a follow-up epic instead of absorbing it into this closing story"
    - "Do not relitigate question-extraction/escalation-classification's checkpoint outcomes — document them as they actually landed, don't retry them here"

steps:
  - id: research
    description: Review the actual outcomes of question-extraction and escalation-classification (converged or checkpoint-not-met) and the current state of docs/architecture.md to identify any gaps between as-built behavior and documented behavior.
    agent: researcher
  - id: test-spec
    description: Write failing node:test tests for the 3-concurrent-runs proof and any error-enum branches not already covered by prior stories' tests. Do NOT read the implementation (there should be little to no new implementation — this is primarily a verification pass).
    agent: tester
    depends_on: [research]
  - id: implement
    description: Fix any gaps the tests reveal (e.g., a listRuns accuracy bug under concurrency); update docs/architecture.md if the research step found undocumented as-built divergence.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review the full epic's test suite for green status end-to-end, and confirm docs/architecture.md accurately reflects reality before signing off.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch. This closes epic agent-drivable-core.
    agent: developer
    depends_on: [review]

