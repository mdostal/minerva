design_decisions:
  - decision: "Same honesty-under-timebox principle as question-extraction: a documented 'not met' is a complete, valid outcome"
    rationale: "Consistency with question-extraction's precedent — both risky slices get the same discipline, per the TPM review's original ask applying to both."
  - decision: "Judgment-quality bar (80% match against curated pairs) is separate from and additional to the parseability bar (90%)"
    rationale: "Architect review explicitly distinguished these as different failure modes — a classifier that always parses but always guesses wrong would pass a parseability-only bar and shouldn't."

cross_cutting:
  - concern: documentation
    action: "Same as question-extraction: update docs/architecture.md's Escalation Classifier component description with the actual as-built behavior (real self-classification, or always-human-default if checkpoint not met)."

risks:
  - severity: high
    description: "Unprototyped, and compounds question-extraction's risk (depends on it directly) plus carries an inherent self-grading bias that the convergence bar can catch but not eliminate"
    mitigation: "Explicit timebox + dual convergence bars (parseability AND judgment-quality) + a safe, working fallback (always-human, consistent with the hard 'never guess' exclusion) if either bar isn't met"

references:
  - path: docs/architecture.md
    relevant_excerpt: |
      AD-2 — Escalation = structured output + confidence, decided externally... in v1, with
      neither wired yet, the enforced channel simply defaults to suggested_channel — nothing
      currently overrides it.
  - path: .pHive/epics/agent-drivable-core/docs/design-discussion.md
    relevant_excerpt: |
      a model self-grading the ambiguity/confidence of a question it just chose to ask is a
      biased judge — no independent perspective, mild incentive to resolve cleanly. This is
      exactly why AD-2 makes the channel a "suggestion" decided externally rather than ground
      truth Minerva trusts.
