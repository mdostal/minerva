id: escalation-classification
epic: agent-drivable-core
title: Escalation Classifier — self-classification + channel enforcement (AD-2, TIMEBOXED spike-with-checkpoint)
status: shipped
shipped_at: "2026-07-26T06:35:00Z"
release_id: "minerva-v0.1.1"
complexity: high
methodology: tdd
depends_on: [question-extraction]

description: |
  Implement AD-2's escalation classification: when the Kickoff+Plan Engine drives a headless
  session, append instructions asking that same turn to self-classify each question it asks
  against the anchored escalate/absorb principle (strategic/ambiguous/irreversible/
  low-confidence -> escalate; routine/mechanical/pre-decided -> absorb), emitting
  {suggested_channel, confidence, reason} alongside the question text for question-extraction
  to pull out. The enforced `channel` defaults to `suggested_channel` in v1 (no Vesta/Delphi to
  override it yet). Upgrade Channel Routing / Answer Submission from kickoff-engine-plumbing's
  hardcoded human-only stub to real enforcement: getQuestions/submitAnswers now route by the
  actual enforced channel, and WRONG_CHANNEL is exercised for real. This is vertical-plan.md's
  Slice 5 — TIMEBOXED as a spike-with-checkpoint like question-extraction, and depends on it
  directly (classification is extracted alongside the question in the same pass).

  TIMEBOX AND CONVERGENCE BAR (per vertical-plan.md Slice 5 — do not silently loosen these):
    - Timebox: 2 implementation days.
    - Convergence bar (both required): (1) parseable {suggested_channel, confidence, reason}
      for >=90% of the same corpus used in question-extraction; (2) correctly matches the
      anchored principle's expected channel for >=80% of a separately curated set of >=10
      question/expected-channel pairs spanning both "should escalate" and "should absorb"
      cases. Parseability alone does NOT satisfy this bar — judgment quality is a distinct
      failure mode from parseability (architect review finding).
    - IF EITHER BAR ISN'T MET: do not block the epic. Ship kickoff-engine-plumbing's
      always-human default as v1's actual behavior (safe, consistent with "when uncertain,
      escalate"), update docs/architecture.md to document this as a known limitation, and hand
      off a follow-up epic. A documented "not met" is a valid, complete outcome.

  KNOWN LIMITATION, NAMED NOT SOLVED: a model self-grading the ambiguity/confidence of a
  question it just chose to ask is a biased judge — no independent perspective. AD-2's
  "suggestion, not ground truth" framing mitigates how much Minerva's architecture TRUSTS the
  signal; it does not mitigate the risk that the signal itself is unreliable. This story's
  judgment-quality convergence bar exists specifically to catch that, not just paper over it.

acceptance_criteria:
  - "Given the same >=15-entry corpus used in question-extraction, when self-classification runs against each, then it produces a parseable {suggested_channel, confidence, reason} for >=90% of them"
  - "Given a separately curated set of >=10 question/expected-channel pairs (spanning both escalate and absorb cases), when self-classification runs against each, then it matches the anchored principle's expected channel for >=80% of them"
  - "Given a question with no external override present (v1 has none), when getQuestions is called, then the enforced channel equals the classifier's suggested_channel"
  - "Given an answer submitted on a channel that doesn't match a question's enforced channel, when submitAnswers is called, then it returns WRONG_CHANNEL and the run does not advance — now exercised against REAL classified questions, not kickoff-engine-plumbing's hardcoded human-only stub"
  - "Given the timebox/convergence bars are NOT met, when the story is closed out, then docs/architecture.md is updated to document the always-human default as v1's shipped behavior, and a follow-up epic is identified"

scope_boundaries:
  do:
    - "Implement self-classification + enforced-channel defaulting + real WRONG_CHANNEL enforcement"
    - "Honor the 2-day timebox literally, same discipline as question-extraction"
  do_not:
    - "Do not build any external override mechanism (Vesta/Delphi) — v1 has none; enforced channel simply defaults to suggested_channel, full stop"
    - "Do not silently extend past the 2-day timebox — a documented 'not met' is this story's valid alternate completion"
    - "Do not treat parseability alone as convergence — the judgment-quality bar (>=80% match against curated pairs) must be evaluated separately and both bars must pass"

steps:
  - id: research
    description: Design the classification-instruction prompt to append at the Kickoff+Plan Engine's spawn point, and build the separately curated >=10-entry question/expected-channel pairs set (distinct from question-extraction's phrasing corpus) covering both escalate and absorb cases per the anchored principle.
    agent: researcher
  - id: test-spec
    description: Write failing node:test tests asserting both convergence bars (parseability >=90%, judgment-match >=80%) plus WRONG_CHANNEL enforcement against real classified questions. Do NOT read the implementation.
    agent: tester
    depends_on: [research]
  - id: implement
    description: >
      Implement the classification-instruction injection, extraction-side classification
      parsing (extending question-extraction's parser), and enforced-channel defaulting +
      real WRONG_CHANNEL enforcement. TIMEBOXED: if the 2-day box elapses without meeting both
      bars, stop and produce the checkpoint-not-met documentation instead.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review implementation and tests, specifically checking that the judgment-quality bar was actually evaluated (not just parseability) before declaring convergence.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch, including whichever outcome (converged implementation, or checkpoint-not-met documentation) actually resulted.
    agent: developer
    depends_on: [review]

