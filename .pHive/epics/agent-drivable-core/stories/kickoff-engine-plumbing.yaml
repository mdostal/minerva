      purpose: "The proven headless invoke/resume pattern this story wires behind bin/minerva — copy the mechanism, don't re-derive it"
    - path: docs/architecture.md
      purpose: "\"No Autonomous Progress\" section — the invariant this story's tests must actively verify, not just document"

files_to_modify:
  - file: src/kickoff-engine.ts
    change: "Create — claude -p spawn on startRun, --resume on submitAnswers, raw-prose surfacing"
  - file: bin/minerva
    change: "Wire getQuestions/submitAnswers dispatch to the engine"

code_examples:
  - title: "Proven headless spawn + resume pattern from this epic's own spike"
    file: docs/spike-plugin-hive-drivability-spike.test.ts
    snippet: |
      function claudeP(args, opts = {}) {
        const out = execFileSync("claude", ["-p", "--model", MODEL, "--output-format", "json",
          "--permission-mode", "bypassPermissions", ...args], {
          cwd: scratchRepo, encoding: "utf8", timeout: opts.timeout ?? 60_000,
        });
        return JSON.parse(out);
      }
      // resume: claudeP(["--resume", sessionId, answerText])

design_decisions:
  - decision: "Ship raw-prose passthrough now; extraction and classification are separate, later stories"
    rationale: "Architect + TPM collaborative review both independently flagged that bundling engine plumbing (spike-proven, low risk) with question extraction (unprototyped, high risk) gates the low-risk plumbing on solving the hardest unknown in the epic. Splitting lets this story ship and verify the core async loop on its own."

cross_cutting: []

risks:
  - severity: medium
    description: "submitAnswers is the only thing that should advance a run, and that's easy to violate by accident (e.g. a retry loop around a flaky claude -p call)"
    mitigation: "Explicit acceptance criterion + test asserting repeated getRunStatus polling never advances a run without a submitAnswers call"

references:
  - path: docs/architecture.md
    relevant_excerpt: |
      Minerva has no daemon and nothing polls or advances a run on its own. A run only moves
      when a caller invokes `submitAnswers`... `getRunStatus: in_progress` between calls does
      not mean work is happening in the background; it means the run is paused, awaiting the
      next drive call.
  - path: docs/spike-plugin-hive-drivability-findings.md
    relevant_excerpt: |
      Real kickoff skill resume: claude -p --resume <session_id> "no, keep metrics off" —
      same session_id, 2 turns, $0.031, and it advanced to the next gate in the actual kickoff
      protocol, not just a generic acknowledgement.
