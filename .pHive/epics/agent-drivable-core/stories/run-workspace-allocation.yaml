references:
  - path: .pHive/epics/agent-drivable-core/docs/design-discussion.md
    relevant_excerpt: |
      Fixing a real concurrency bug the architect review caught: "worktree off `dev`," read
      literally, means checking out branch `dev` itself into the new worktree. Git refuses to
      have the same branch checked out in two worktrees at once... Fix: each run's worktree
      checks out a run-scoped branch cut from `dev` (e.g. `run/<run_id>`), not `dev` itself.
  - path: .pHive/cycle-state/agent-drivable-core.yaml
    relevant_excerpt: |
