design_decisions:
  - decision: "Scope to ForkedHiveDriver only, not SpawnDriver/SubagentDriver."
    rationale: "Matches what was actually proposed (stale PR #57) and what the triage entry documented -- not expanding beyond the surfaced idea."
  - decision: "Separate mechanism from RunMetrics, not a merge/extension of it."
    rationale: "RunMetrics is per-run introspection (turns/driver/elapsed for THIS run, read via getRunStatus/getOutput); this is a flat, cross-run operational event log for external tailing/shipping. Different consumers, different shape."
  - decision: "Telemetry write failures are not swallowed."
    rationale: "Matches this codebase's fail-loud discipline (CONTEXT.md conventions) -- a real fs error writing telemetry is worth surfacing, not hiding, even though telemetry itself is opt-in/best-effort in spirit."

