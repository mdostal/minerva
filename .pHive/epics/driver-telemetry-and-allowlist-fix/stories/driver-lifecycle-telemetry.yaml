    description: Re-confirm ForkedHiveDriver.runTurn()'s exact current structure in src/driver.ts around the spawnRuntime() call, and real-forked-hive-driver.test.ts's current before()/after() hooks (confirm MINERVA_HOME is genuinely absent, matching this story's H1 finding).
    agent: researcher
  - id: test-spec
    description: |
      Add MINERVA_HOME isolation to real-forked-hive-driver.test.ts's before()/after() hooks
      FIRST (required per this story's placement constraint), then write failing tests for all 4
      acceptance criteria. Do NOT read driver.ts's implementation details beyond the class/method
      signature before writing tests -- write from the acceptance criteria.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Create src/telemetry.ts and wire ForkedHiveDriver.runTurn() to emit the three events. Make the failing tests pass without modifying them.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm telemetry never swallows/alters runTurn's original error behavior, confirm MINERVA_HOME isolation actually works (no real ~/.minerva pollution), confirm scope stays ForkedHiveDriver-only and doesn't touch RunMetrics.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to the epic branch.
    agent: developer
    depends_on: [review]

