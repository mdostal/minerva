id: driver-lifecycle-telemetry
epic: driver-telemetry-and-allowlist-fix
title: "driver_started/driver_succeeded/driver_failed telemetry for ForkedHiveDriver"
status: pending
complexity: low
methodology: tdd
depends_on: []

description: |
  Recovered from a stale, never-merged PR (#57, opened 2026-08-11) that proposed a real,
  genuinely-still-missing capability -- confirmed via grep that neither src/telemetry.ts nor
  any driver_started/driver_succeeded/driver_failed reference exists anywhere on dev/main today.
  Do NOT merge the old branch -- it predates and would conflict with the fix-test-suite-
  flakiness-t006 fix to real-forked-hive-driver.test.ts's FORK_PATH handling. Fresh
  implementation against current code only.

  Add a new src/telemetry.ts exporting emitTelemetryEvent(event: string, payload?: object): void,
  which appends one JSON line ({event, emitted_at, ...payload}) to
  <MINERVA_HOME>/events/<event>.jsonl (MINERVA_HOME resolution matches the existing convention:
  process.env.MINERVA_HOME ?? join(homedir(), ".minerva"), already used in run-manager.ts).

  Wire it into src/driver.ts's ForkedHiveDriver.runTurn() around the existing spawnRuntime()
  call: emit driver_started before, driver_succeeded after success, driver_failed (with
  err.message) in a catch that RETHROWS the original error unchanged -- telemetry must never
  swallow or alter runTurn's existing control flow/error behavior.

  This is deliberately scoped to ForkedHiveDriver only (not SpawnDriver/SubagentDriver) --
  matches what was actually proposed and what the triage entry documented. It is also
  deliberately separate from the existing RunMetrics system (recordDriverTurn/
  updateRunMetricsDriver/finalizeRunMetrics in run-manager.ts) -- RunMetrics is per-run
  introspection embedded in the run record; this is a flat, cross-run operational event log an
  operator could tail/ship externally. Do not conflate or merge the two mechanisms.

  TEST ISOLATION (confirmed by grill round 1, finding H1 -- required, not optional):
  src/real-forked-hive-driver.test.ts does NOT currently set MINERVA_HOME (confirmed via grep).
  Its before()/after() hooks only touch MINERVA_HEIMDALL_AVAILABLE_ROUTE_URL and
  MINERVA_HIVE_PLUGIN_DIR. The test-spec step MUST add a MINERVA_HOME override (mkdtempSync-based
  temp dir, matching the pattern already used in run-manager.test.ts) to this file's
  before()/after() hooks before writing any test that exercises ForkedHiveDriver.runTurn() and
  checks telemetry output -- otherwise the test would write real JSONL files into the developer's
  actual ~/.minerva/events/ directory.

acceptance_criteria:
  - "Given ForkedHiveDriver.runTurn() is called and spawnRuntime() succeeds, when the turn completes, then a driver_started event and a driver_succeeded event are appended to <MINERVA_HOME>/events/driver_started.jsonl and driver_succeeded.jsonl respectively, each a valid JSON line with an emitted_at ISO timestamp."
  - "Given ForkedHiveDriver.runTurn() is called and spawnRuntime() throws, when the turn fails, then a driver_started event AND a driver_failed event (containing the error message) are appended, the driver_succeeded event is NOT appended, and the original error is rethrown unchanged (same error type/message the caller would have seen before this change)."
  - "Given MINERVA_HOME is set to an isolated temp directory (test convention), when telemetry events are emitted during a test run, then no files are written outside that temp directory -- confirmed by NOT finding new files under the real ~/.minerva/events/ after the test."
  - "Given src/real-forked-hive-driver.test.ts's existing tests (the two from the forked-driver-integration epic), when the full test file runs after this change, then they still pass unchanged -- confirms the new MINERVA_HOME isolation and telemetry wiring don't regress the existing live-integration tests."

metric:
  applies: false
  justification: "Pure observability addition (an event log an operator may or may not consume) -- no product behavior to trend against; the acceptance-criteria tests are the only falsifiable surface."

