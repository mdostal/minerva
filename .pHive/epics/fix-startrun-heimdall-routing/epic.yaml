  - id: add-upstream-error-code
    title: Add a distinct ErrorCode for internal/upstream failures instead of mislabeling them UNKNOWN_METHOD
    complexity: low
    depends_on: [fix-heimdall-route-fail-fast-with-fallback]
  - id: auto-cleanup-orphaned-runs-on-first-turn-failure
    title: Transition a run to aborted automatically when its first drive turn fails
    complexity: medium
    depends_on: [fix-heimdall-route-fail-fast-with-fallback]
  - id: fix-heimdall-task-type-value
    title: Correct the hardcoded Heimdall task-type value (confirmed invalid) to a real, evidenced value
    complexity: low
    depends_on: []
