id: fix-heimdall-route-fail-fast-with-fallback
epic: fix-startrun-heimdall-routing
title: Make resolveRuntimeRoute() fail loudly with a typed error, or use an explicit operator fallback
status: pending
complexity: high
methodology: tdd
depends_on: []

description: |
  `resolveRuntimeRoute()` (src/driver.ts:153-178) throws an untyped `Error` on any Heimdall
  failure (unreachable, non-2xx, malformed body), and every one of its four call sites
  (`SpawnDriver.runTurn()` :595, `SubagentDriver.runTurn()` :670, `ForkedHiveDriver.dispatchFresh()`
  :871, `ForkedHiveDriver.classify()` :949) calls it with zero try/catch. `submitAnswers`
  (kickoff-engine.ts:418, via `driverForRecord()`'s default fallback) hits the identical path.
  This was confirmed live: two real `startRun` invocations against `dev` both failed before a
  single question was ever surfaced.

  Fix `resolveRuntimeRoute()` itself (root-scoped, not per-call-site) so all five exposure points
  inherit the fix automatically:

  1. **Default behavior (no operator fallback configured): fail fast with a typed error**, not an
     untyped `Error`. Define a distinguishable error class/type for "Heimdall routing failed" that
     the debuggability story (add-upstream-error-code, depends on this story) will map to a new
     ErrorCode. Do NOT add the new ErrorCode yourself — that's the next story's job. Just make the
     thrown error type-distinguishable (e.g. a new `HeimdallRouteError` class, or reuse
     `MinervaError` with a specific code that the next story maps at the dispatch layer — your
     call on the cleanest shape, but it must be catchable-and-distinguishable, not a plain `Error`).
  2. **Optional operator fallback**: read `MINERVA_FALLBACK_CLI` and `MINERVA_FALLBACK_MODEL` env
     vars. If *both* are set, use that pair instead of throwing on Heimdall failure — no inference,
     the operator's literal values, used verbatim. If only one is set, that's malformed config —
     fail loudly (same shape as an invalid `MINERVA_TURN_TIMEOUT_MS` today), do not silently ignore
     the partial config.
  3. **Validate `MINERVA_FALLBACK_CLI` against `getAdapter()`'s known CLI set** (`opencode`,
     `codex`, `claude`) at the point this new config is read — fail loudly on an unrecognized
     value. Do NOT change `getAdapter()`'s own default behavior (its silent fallthrough to
     `ClaudeAdapter` for unrecognized values has other callers; changing it is out of scope for
     this story per the design discussion's explicit reasoning — validate at the boundary where
     the new config is read instead).
  4. **`runTurnResumable()` (kickoff-engine.ts:90-101) must NOT retry this new error type.** It
     currently retries only `instanceof TurnTimeoutError`. A Heimdall routing failure is not a
     "ran long" condition — retrying it would mask a real outage as a transient blip and multiply
     load against a service that may already be reporting down. Do not change the retry gating;
     just confirm (with a test) the new error type does NOT extend `TurnTimeoutError` and is not
     swept into the retry path.
  5. **`src/driver-route.test.ts:97-103` currently asserts today's throw-through behavior as
     intentional** (`assert.rejects(...)`). This is not an oversight to silently break — consciously
     rewrite this test to assert the new behavior (typed error when unset, fallback-pair-used when
     both env vars set, loud failure when only one is set, unrecognized CLI rejected). Do not leave
     the old assertion in place alongside new tests; replace it.

  DO NOT: implement the new ErrorCode value itself (next story), implement the auto-cleanup hook
  (separate story), or touch the Heimdall task-type value (`task-type=kickoff` string — separate,
  independent story). This story is scoped to resolveRuntimeRoute()'s error-handling shape and the
  operator-fallback config surface only.

acceptance_criteria:
  - "Given no MINERVA_FALLBACK_CLI/MODEL set and Heimdall unreachable or erroring, when resolveRuntimeRoute() is called from any of the 4 call sites (SpawnDriver, SubagentDriver, ForkedHiveDriver.dispatchFresh, ForkedHiveDriver.classify) or via submitAnswers, then it throws a distinguishable, typed error (not a plain Error)"
  - "Given both MINERVA_FALLBACK_CLI and MINERVA_FALLBACK_MODEL set to valid values (one of opencode/codex/claude for the CLI), when Heimdall fails, then resolveRuntimeRoute() returns that exact pair instead of throwing"
  - "Given only one of MINERVA_FALLBACK_CLI or MINERVA_FALLBACK_MODEL set, when resolveRuntimeRoute() is called, then it fails loudly (throws) regardless of whether Heimdall is reachable -- malformed config is never silently ignored"
  - "Given MINERVA_FALLBACK_CLI set to a value not in {opencode, codex, claude}, when resolveRuntimeRoute() is called, then it fails loudly at config-read time rather than silently falling through to ClaudeAdapter"
  - "Given the new error type, when runTurnResumable() encounters it, then it is NOT retried (does not extend TurnTimeoutError, propagates on first attempt exactly like today)"
  - "Given src/driver-route.test.ts, when npx tsx --test src/driver-route.test.ts runs after this story, then it asserts the NEW behavior (no stale assertions of the old untyped-throw-always behavior left in place)"
  - "Given npx tsc --noEmit, when run, then it passes with zero errors"

