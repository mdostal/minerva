design_decisions:
  - decision: Validate the fallback CLI at the config-read boundary, not inside getAdapter()
    rationale: "getAdapter() is an existing, shared function with callers beyond this new fallback path; changing its default behavior has a larger, less-contained blast radius than validating one new env var where it's read (architect review finding, design-discussion.md §3a)"
  - decision: Fix resolveRuntimeRoute() itself (root-scoped) rather than wrapping each of the 4 call sites individually
    rationale: "One fix location, all 5 exposure points (4 call sites + submitAnswers) inherit it automatically and consistently; this scope call is safe specifically because the fix is fail-fast/declared-fallback, not an undeclared fail-open (design-discussion.md §3b)"

risks:
  - severity: high
    description: An implementer who validates the fallback pair's presence but not its individual values (e.g. accepts an empty-string MINERVA_FALLBACK_MODEL) could silently mask a real "no runtime available" state as false success
    mitigation: Acceptance criteria explicitly require both env vars to be validated as non-empty/meaningful, not just present; reviewer step must check for this specifically

references:
  - path: .pHive/epics/fix-startrun-heimdall-routing/docs/design-discussion.md
    relevant_excerpt: |
      §3(a): "fail-fast is the default and only behavior when no fallback is configured...
      When an operator has explicitly configured MINERVA_FALLBACK_CLI/MINERVA_FALLBACK_MODEL,
      that declared pair is used instead... validate MINERVA_FALLBACK_CLI against getAdapter's
      known CLI set... at config-read time, and fail loudly on an unrecognized value."
