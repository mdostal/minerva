id: fix-heimdall-task-type-value
epic: fix-startrun-heimdall-routing
title: Correct the hardcoded Heimdall task-type value (confirmed invalid) to a real, evidenced value
status: shipped
reconciliation_note: >
  Confirmed already shipped via a reality-check audit (2026-08-20) -- work landed via direct
  commits documented in CHANGELOG.md's release-finalization entries, story YAML was simply
  never updated. Evidence: src/driver.ts:152, src/agnostic-plan-driver.ts:101 both use task-type=planning.

complexity: low
methodology: classic
depends_on: []

parallel_allowed: true
parallel_rationale: bounded-slice
files_to_modify:
  - file: src/driver.ts
    change: "correct availableRouteUrl()'s hardcoded task-type=kickoff query param to a valid Heimdall task type"
  - file: src/driver-route.test.ts
    change: "update/add a test asserting the corrected task-type value is sent"

description: |
  `src/driver.ts`'s `availableRouteUrl()` (lines 119-124) hardcodes `task-type=kickoff` in its
  query string to Heimdall's `/available-route` endpoint. This was confirmed live, against a real
  running Heimdall instance, to be rejected: `HTTP 400 {"error":"invalid_task_type",
  "allowed_task_types":["planning","build","review"]}`. `"kickoff"` is not a valid Heimdall task
  type today.

  This story is independent of the other three (fixes a different, narrower bug in the same file)
  and can proceed in parallel with them -- it touches `availableRouteUrl()` specifically, not
  `resolveRuntimeRoute()`'s error-handling shape.

  **Investigate before guessing.** Do not pick a value arbitrarily. Working hypothesis to verify,
  not assume: Minerva's kickoff phase (what `startRun`/`SpawnDriver` drives) runs plugin-hive's
  kickoff+plan skills -- research, design discussion, and story decomposition -- which is
  fundamentally a *planning* activity, not code implementation (`build`) or code review (`review`).
  Minerva's own `src/agnostic-plan-driver.ts` already calls Heimdall with `task-type=planning`
  (`resolvePlanningRoute()`, line 88) for its own planning-flavored turns, and that call is
  confirmed working (not rejected) against the live Heimdall instance tested during this epic's
  research. This makes `planning` a well-evidenced candidate for `startRun`'s task type too, but it
  is NOT confirmed -- verify it, don't assume it transfers just because both are "planning-shaped."

  Steps to resolve, in order:
  1. Check the sibling Heimdall repo (`/Users/mdostal/Documents/work/pantheon/heimdall`) for any
     documentation describing what `planning`/`build`/`review` task types mean and are intended
     for -- README, docs/, or source comments near the `/available-route` handler. This may
     directly confirm or rule out the `planning` hypothesis without needing to ask anyone.
  2. If step 1 is inconclusive, check whether Heimdall's repo has any existing consumer/caller
     code (grep for `available-route` or `task-type=` across the Heimdall repo, or any known
     Pantheon service source you have access to) that already calls it with a task type for a
     kickoff-shaped or research-shaped activity, as corroborating evidence.
  3. If steps 1-2 together produce a confident answer, implement it and write a test.
  4. **If genuinely still ambiguous after 1-2, do not guess.** Per this epic's own "fail loudly,
     never guess" philosophy (consistent with the other 3 stories), stop and report clearly: what
     was checked, what remains unconfirmed, and that this specific piece requires input from
     Heimdall's owners before it can be safely implemented. Do not ship a guessed value -- per the
     design discussion's risk analysis, guessing wrong here silently misroutes production traffic
     to the wrong Heimdall-side capacity pool rather than failing loudly, which is a worse outcome
     than today's clear 400.

  Note: even with the correct task-type value, this story alone will NOT make `startRun` succeed
  end-to-end in every environment -- the live test also found the local `claude@mathew.dostal`
  Heimdall lane reporting `"down"`/`"unconfigured"`, which is a Heimdall-side/deployment-side
  configuration gap outside Minerva's code and explicitly out of scope for this story.

acceptance_criteria:
  - "Given step 1-2 investigation produces a confident, evidenced answer, when this story completes, then availableRouteUrl() sends that value instead of 'kickoff', and a test asserts it"
  - "Given the corrected value, when tested against a live Heimdall instance (manually, not necessarily in the automated test suite), then /available-route no longer returns invalid_task_type for this call"
  - "Given the investigation is genuinely inconclusive, when this story completes, then it reports exactly what was checked and why it remains unconfirmed, and does NOT ship a guessed value -- this is an acceptable, correct outcome for this story, not a failure to fix"

