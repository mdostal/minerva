planning_team:
  matched_tags: [driver-abstraction, headless-agent-driven, protocol-integration, no-ui]
  roster: [researcher, tester, developer, reviewer]
  per_tag_reasoning:
    driver-abstraction: "Fills in the ForkedHiveDriver seam left inert by the swappable-driver epic -- same Driver interface, third implementation"
    headless-agent-driven: "The whole epic is driving a real headless protocol shipped in a fork of plugin-hive, verified empirically via direct claude --plugin-dir testing before any story was finalized"
    protocol-integration: "Consuming an external system's (plugin-hive-fork's) file-based protocol, not just internal refactoring -- requires careful attention to that system's actual (not assumed) semantics, per the two empirical findings this epic's own research surfaced"
    no-ui: "has_ui: false, unchanged from prior epics -- no ui-designer needed"
  confidence: high
  gate_decisions:
    scale_assessment: "Medium -- skip H/V ceremony, proceed straight to stories, mirroring swappable-driver's own precedent (the scope doc already did the decomposition-informing research)"
    collaborative_review: "orchestrator-narrated (no Agent-tool spawn) -- consistent with both prior epics' fallback pattern"
    plan_gate: "user-confirmed via AskUserQuestion: 'Yes, build it (Recommended)' for design+decomposition, 'minor (Recommended)' for version_bump, 'committed (Recommended)' for sidecar_retention"

