design_decisions:
  - decision: "Separate -p --json-schema call for classification, not reused inline with envelope parsing"
    rationale: "The envelope already has the question text -- no extraction step is needed, so folding classification into the same combined schema as extraction (as escalation-classification.ts does today for SpawnDriver/SubagentDriver) doesn't apply; a smaller classification-only call is the correct shape here."

cross_cutting: []

risks:
  - severity: low
    description: "A second live-API call per question (beyond the skill's own turn) adds cost/latency, similar to SubagentDriver's extraction-call overhead"
    mitigation: "Accepted -- matches the cost profile already established for SubagentDriver; classification correctness matters more than minimizing this call"

references:
