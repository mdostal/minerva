id: question-answer-type-extension
epic: forked-driver-integration
title: Question/Answer type extension decision + implementation
status: shipped
reconciliation_note: >
  Built and released via the forked-driver-integration commit chain, tracked outside this Hive epic's
  story IDs -- status field was never updated even though the work landed and shipped.
  Reconciled 2026-08-19 during the pre-open-source-release backlog sweep; see the
  epic-reality-check audit for the corroborating commits.

complexity: medium
methodology: tdd
depends_on: [spike-stateless-model-tier]

description: |
  Minerva's current `Question`/`Answer` types (src/run-manager.ts, src/kickoff-engine.ts) are
  free-text only. Decide and implement one of:

  (a) Extend end-to-end to carry `kind`/`options`/`qid` (more faithful to the upstream envelope,
  lets a human channel render real choices instead of open text).
  (b) Flatten single-select/multi-select to free-text for v1 (simpler, smaller surface area,
  loses the option list).

  The gateway's own code does NOT enforce the documented `kind: single-select | multi-select |
  free-text` enum -- it passes through whatever value the calling skill wrote. UPDATE (per story
  spike-stateless-model-tier's findings): the originally-cited `kind: yes-no` example was
  observed in a pre-fix, self-simulating model run (a wrapper script the model improvised
  because the drive prompt lacked an explicit stop instruction), NOT confirmed genuine
  real-gateway output -- every envelope observed after that fix correctly used
  `kind: single-select`. The underlying claim (the gateway doesn't validate kind in code) is
  still true, so defensive parsing is still required, but do not cite `yes-no` specifically as
  proven real-gateway behavior -- treat it as "a plausible failure shape if something ever goes
  wrong upstream of this parser" rather than "observed normal behavior." Whichever option is
  chosen, the parser MUST handle unrecognized `kind` values defensively (e.g. treat any
  unrecognized value as free-text) rather than throwing or silently misparsing on a value
  outside the three documented ones.

  This is a real architecture decision, not a default -- write it up as a short design note
  (decision + rationale) before implementing.

acceptance_criteria:
  - "Given the chosen extension approach, when implemented, then it is documented as an explicit design_decision with rationale, not silently defaulted"
  - "Given a `kind: yes-no` value (the empirically observed non-enum case), when a question carrying it is processed, then it is handled without throwing -- normalized to a known shape or defensively treated as free-text"
  - "Given the extended (or intentionally-flattened) type, when checked against src/types.test.ts's existing driver-independent contract tests, then no existing test breaks -- this extension is additive, not a breaking change to the current free-text-only shape's callers"
  - "Given `qid`, when carried through the type (if option (a) is chosen), then it round-trips correctly through the answer-submission path so the real driver implementation can address the correct question when writing an answer back"

scope_boundaries:
  do:
    - "Decide and implement the Question/Answer type shape for this driver path"
    - "Handle kind defensively regardless of which option is chosen"
  do_not:
    - "Do not change SpawnDriver's or SubagentDriver's existing Question/Answer usage -- this extension must be additive, not a breaking change to the other two drivers' existing free-text contract"

steps:
  - id: research
    description: Read src/run-manager.ts's current Question/Answer interfaces and src/types.test.ts's existing coverage to confirm what must stay backward-compatible before extending.
    agent: researcher
  - id: test-spec
    description: "Write failing tests for the chosen extension shape, including the kind=yes-no defensive-handling case. Do NOT read the implementation."
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement the type extension (or documented flattening decision). Do not modify the tests.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm the decision is documented with rationale, existing SpawnDriver/SubagentDriver usage is unaffected, and the full existing src/types.test.ts suite still passes unchanged.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/dostal/Documents/work/dostal/code/minerva
  tech_stack:
    languages: [typescript]
  key_files:
    - path: src/run-manager.ts
      purpose: "Current Question/Answer type definitions this story extends"
    - path: src/types.test.ts
      purpose: "The driver-independent contract this extension must not break"

files_to_modify:
  - file: src/run-manager.ts
    change: "Extend (or document why not extending) Question/Answer types"

design_decisions:
  - decision: "Chose option (a): extend end-to-end. Question gains optional kind/options/qid; Answer's answer field becomes string | string[]."
    rationale: "More faithful to the upstream envelope and lets a human channel render real choices instead of open text -- directly serves the epic's own stated motivation. All new fields are additive/optional, so SpawnDriver/SubagentDriver's existing free-text-only Question construction is completely unaffected; confirmed via full typecheck + the existing types.test.ts suite passing unchanged."
  - decision: "kind normalization lives in run-manager.ts as normalizeQuestionKind(), not inline in the envelope parser"
    rationale: "Keeps the defensive boundary (never throw, default to free-text) co-located with the QuestionKind type it protects, reusable by both the next story (envelope-detection-parsing) and any future caller, rather than duplicated logic."
  - decision: "A multi-select (string[]) answer is joined into readable prose before being passed as Driver.runTurn's prompt"
    rationale: "Driver.runTurn's prompt contract is a plain string across all three implementations (SpawnDriver, SubagentDriver, ForkedHiveDriver) -- joining with ', ' matches how a human would phrase multiple selections in a chat message, avoiding a driver-specific prompt-shape special case."

cross_cutting: []

risks:
  - severity: medium
    description: "Extending the type shape touches code shared by SpawnDriver and SubagentDriver -- a careless change could regress the other two drivers"
    mitigation: "Full existing test suite (src/types.test.ts, driver.test.ts, subagent-driver.test.ts) must pass unchanged, per review step"

references:
  - path: docs/scope/forked-driver-integration-next-phase.md
    relevant_excerpt: |
      kind is NOT a validated closed enum in practice, despite being documented as one -- a real
      Sonnet-driven run produced kind: yes-no.
