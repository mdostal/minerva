name: harden-run-id-and-target-repo-boundaries
title: "Harden run_id and target_repo ABI trust boundaries (triage t-008)"
description: >
  Two informational-severity hardening notes from the pre-public-release security review
  (triage t-008), picked up as the final item in the post-release backlog sweep. Neither
  finding blocks any shipped release; both are additive validation with no behavior change
  for any caller already passing valid input.

  1. Reject non-UUID run_id values at the dispatch.ts/mcp-server.ts ABI boundary instead of
     letting an arbitrary string reach a filesystem path join in run-manager.ts.
  2. Add an optional MINERVA_ALLOWED_TARGET_REPOS allowlist env var so operators of
     less-trusted deployments can constrain which local repo paths startRun may target;
     absent (the default), behavior is unchanged.
target_codebase: /Users/mdostal/Documents/work/pantheon/minerva
methodology: tdd
version_bump: patch
sidecar_retention: committed

