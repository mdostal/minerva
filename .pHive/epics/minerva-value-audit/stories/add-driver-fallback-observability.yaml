    file: src/agnostic-plan-driver.test.ts
    snippet: |
      // A fake plan-agnostic CLI: writes its argv to $FAKE_ARGV_OUT, prints the canned result line.
      function writeFakeCli(): { cliPath: string; argvOut: string } {
        const dir = mkdtempSync(join(tmpdir(), "agnostic-cli-"));
        const cliPath = join(dir, "fake-plan-agnostic.mjs");
        ...
      }
  - title: The exact silent-null site to instrument
    file: src/agnostic-plan-driver.ts
    snippet: |
      export function agnosticPlanCliPath(): string | null {
        // ... canon() helper checks each candidate ...
        for (const p of candidates) {
          const r = canon(p);
          if (r) return r;
        }
        return null;  // <-- WARN log goes here, naming which candidates were checked
      }

design_decisions:
  - decision: Log to stderr as a single structured JSON line, not a new metrics-events JSONL file under .pHive/metrics/events/
    rationale: This project has no existing metrics-events writer in src/ (that's a Hive-plugin-side concept, not wired into Minerva's own runtime); stderr is the lowest-friction, zero-new-dependency way to make these two paths greppable/alertable in whatever harness runs Minerva, consistent with the project's existing "fail loud, never guess" discipline (see .pHive/CONTEXT.md conventions)

cross_cutting:
  - concern: documentation
    action: "No doc changes needed — this is pure code observability; the dependency itself is documented separately in document-pr341-production-dependency"

risks:
  - severity: low
    description: A poorly-worded log line could be mistaken for an actual error and page someone unnecessarily
    mitigation: Use WARN level (not ERROR), and word the message to say "falling back" / "no envelope found" rather than implying a crash

references:
  - path: .pHive/epics/minerva-value-audit/docs/design-discussion.md
    relevant_excerpt: |
      §4 (architect-added nuance): "running with MINERVA_HIVE_PLUGIN_DIR unset against a real
      marketplace-installed plugin-hive that predates #341 doesn't error at all... looks exactly
      like success while silently never pausing for a single question."
