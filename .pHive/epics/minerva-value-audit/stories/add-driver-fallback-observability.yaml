id: add-driver-fallback-observability
epic: minerva-value-audit
title: Make Minerva's two silent driver-fallback paths loudly observable
status: pending
complexity: medium
methodology: tdd
depends_on: []

parallel_allowed: true
parallel_rationale: bounded-slice
files_to_modify:
  - file: src/agnostic-plan-driver.ts
    change: "emit a structured WARN-level stderr log line (JSON, one line) whenever agnosticPlanCliPath() resolves to null inside resolveAgnosticPlanDriver(), naming which candidate paths were checked"
  - file: src/driver.ts
    change: "emit a structured WARN-level stderr log line whenever ForkedHiveDriver.surfaceNextQuestion() falls through to the NO_PENDING_SENTINEL zero-envelopes case, distinguishing 'run legitimately complete' from 'no envelope was ever written because MINERVA_HIVE_PLUGIN_DIR is unset against a pre-#341 plugin-hive install'"
  - file: src/agnostic-plan-driver.test.ts
    change: add a test asserting the WARN log fires when all candidate paths are absent
  - file: src/driver.test.ts
    change: add a test asserting the WARN log fires on the zero-envelopes NO_PENDING_SENTINEL path

description: |
  Two silent-failure paths were found during this epic's research and confirmed by direct source
  review (design-discussion.md §4, architect collaborative review):

  1. `agnosticPlanCliPath()` in src/agnostic-plan-driver.ts returns `null` when none of its five
     candidate paths exist, and `resolveAgnosticPlanDriver()` silently falls back to the built-in
     claude SpawnDriver with no error surfaced. PAN-7734 (already fixed on this branch) confirmed
     this was a real production bug that starved a build lane before anyone noticed.
  2. `ForkedHiveDriver.surfaceNextQuestion()` (src/driver.ts) falls through to the
     `NO_PENDING_SENTINEL` "run may be complete" placeholder both when a run legitimately finished
     AND when no envelope was ever written because `MINERVA_HIVE_PLUGIN_DIR` is unset against a
     plugin-hive install that predates PR #341 — these two cases are indistinguishable today.

  Add a single-line, structured (JSON) WARN-level log to stderr for each case, so a real
  deployment can `grep` or alert on these instead of the failure being invisible. Do NOT change
  behavior otherwise — both paths must continue to degrade gracefully (fall back / surface the
  placeholder) exactly as today; this story only adds visibility, not new control flow.

  DO NOT: change the fallback behavior itself, add a new config flag to disable the fallback, or
  touch any of the three ClaudeAdapter/OpencodeAdapter/CodexAdapter classes (out of scope — this
  story is observability-only on the two specific silent paths named above).

acceptance_criteria:
  - "Given all five agnosticPlanCliPath() candidates are absent, when resolveAgnosticPlanDriver() runs, then exactly one WARN-level JSON line is written to stderr naming the checked candidate paths, and the function still returns null (fallback behavior unchanged)"
  - "Given ForkedHiveDriver.surfaceNextQuestion() finds zero pending envelopes, when it returns the NO_PENDING_SENTINEL result, then exactly one WARN-level JSON line is written to stderr, and the returned DriverResult is unchanged from today's shape"
  - "Given npm test, when run, then both new tests pass alongside all existing tests (no regressions)"
  - "Given npm run typecheck, when run, then it passes with zero errors"

metric:
  applies: true
  name: driver.fallback_visibility_events_logged
  direction: up
  unit: count
  baseline: 0
  target: 1
  window: "story integrate step"
  source:
    kind: manual
    ref: "Run `npm test -- src/agnostic-plan-driver.test.ts src/driver.test.ts` and confirm the two new WARN-log assertions pass (i.e. exactly one structured log line fires per fallback path, where zero fired before this story)"
  verify_at: "story integrate step"
  owner: developer

steps:
  - id: research
    description: Read agnosticPlanCliPath()/resolveAgnosticPlanDriver() in src/agnostic-plan-driver.ts and surfaceNextQuestion() in src/driver.ts to confirm exact insertion points; check whether any existing logging utility/convention exists elsewhere in src/ to reuse instead of inventing a new one.
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests first: (1) in src/agnostic-plan-driver.test.ts, a test that stubs/removes
      all candidate paths and asserts a WARN log line is captured on stderr; (2) in src/driver.test.ts,
      a test that drives ForkedHiveDriver to the zero-envelopes NO_PENDING_SENTINEL path and asserts
      a WARN log line is captured. Do NOT read the implementation to write these — derive expected
      behavior from the acceptance criteria above.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Add the two structured WARN-log lines to make the failing tests pass. Do not modify the tests.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm the log lines are genuinely structured/greppable (not free-text prose), confirm fallback behavior is byte-identical to before this story, confirm no scope creep into the adapter classes.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

