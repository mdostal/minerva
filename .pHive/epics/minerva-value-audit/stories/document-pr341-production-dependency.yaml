id: document-pr341-production-dependency
epic: minerva-value-audit
title: Document ForkedHiveDriver's production dependency on plugin-hive PR #341
status: shipped
reconciliation_note: >
  Confirmed already shipped via a reality-check audit (2026-08-20) -- work landed via direct
  commits documented in CHANGELOG.md's release-finalization entries, story YAML was simply
  never updated. Evidence: docs/decisions/002-pr341-production-dependency.md exists.

complexity: low
methodology: classic
depends_on: []

parallel_allowed: true
parallel_rationale: bounded-slice
files_to_modify:
  - file: docs/decisions/002-pr341-production-dependency.md
    change: create — the decision record documenting the dependency
  - file: docs/architecture.md
    change: add a one-paragraph cross-reference to the new decision doc near the Driver/ABI section

description: |
  This epic's research (design-discussion.md, §2/§5) found that ForkedHiveDriver's *intended*
  production path never carries the question/pause/envelope protocol until firefly-events/
  plugin-hive#341 ships (or an equivalent lands via the normal marketplace mechanism) — today,
  only the MINERVA_HIVE_PLUGIN_DIR local-fork-checkout path (explicitly commented in driver.ts as
  a *testing* stopgap) actually carries it. This is currently documented only in code comments
  (src/driver.ts lines ~699-745, src/envelope-detection.ts header). Write it down where an
  operator or a future planning epic will actually see it before depending on ForkedHiveDriver in
  production: a dedicated decision record, cross-linked from docs/architecture.md.

  Include a `recheck_by` date (30 days from this story's integrate step) and an explicit
  instruction for what "recheck" means: re-run `gh pr view 341 --repo firefly-events/plugin-hive
  --json state,reviewDecision,updatedAt` and update this doc's status line. This satisfies the
  TPM collaborative-review finding that the epic's highest risk (§4 of design-discussion.md) had
  no dated checkpoint, without inventing new tooling — it's a documented, operator-driven
  re-check per this project's existing convention (see triage-queue-schema.md's explicit
  "time-based auto-advance is operator-driven by design" position; this follows the same posture).

acceptance_criteria:
  - "Given docs/decisions/002-pr341-production-dependency.md does not exist, when this story completes, then it exists and cites firefly-events/plugin-hive#341, the two production-path code locations (src/driver.ts ForkedHiveDriver class comment, src/envelope-detection.ts header), and states plainly which path (MINERVA_HIVE_PLUGIN_DIR unset vs set) is production vs testing today"
  - "Given the new doc, when read, then it includes a `recheck_by:` dated field (30 days from integrate) and the exact gh CLI command to re-check PR #341's status"
  - "Given docs/architecture.md, when read, then it contains a one-paragraph cross-reference to the new decision doc, placed near wherever the Driver/ABI contract is currently described"

metric:
  applies: false
  justification: "Pure-doc story; no observable runtime surface. The dependency it documents is tracked qualitatively via the recheck_by date and PR #341's own state, not a metric."

steps:
  - id: research
    description: Read src/driver.ts (ForkedHiveDriver class + its header comment), src/envelope-detection.ts (header comment), and docs/architecture.md's current structure to find the right insertion point for the cross-reference.
    agent: researcher
  - id: implement
    description: Write docs/decisions/002-pr341-production-dependency.md per the description above; add the cross-reference paragraph to docs/architecture.md.
    agent: developer
    depends_on: [research]
  - id: test
    description: Verify the new doc exists and contains the required citations; verify the cross-reference was added to docs/architecture.md.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm the decision doc accurately reflects driver.ts/envelope-detection.ts (no paraphrase drift) and that the recheck_by date/command are concrete and runnable.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

