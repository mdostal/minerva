id: core-rip-out-consus-coupling
epic: rip-out-consus-coupling
title: Remove all Consus coupling from Minerva's core ABI, engine, and CLI
status: shipped
reconciliation_note: >
  Confirmed already shipped via a reality-check audit (2026-08-20) -- work landed via direct
  commits documented in CHANGELOG.md's release-finalization entries, story YAML was simply
  never updated. Evidence: src/consus-*.ts confirmed absent from the tree.

complexity: high
methodology: tdd
depends_on: []

description: |
  Minerva's core code is directly, unconditionally coupled to Consus (renamed Delphi), violating
  the pre-existing, already-approved v1 requirement in docs/product-brief.md and
  docs/initial-info.md: zero dependency on Delphi/Auriga/Vulcan/Multica/votem existing. This was
  discovered live: a real Consus service happened to be reachable on a dev machine and silently
  broke 20 tests (run status flipped to "awaiting-consus" instead of the expected
  "waiting_on_human"). The operator's directive is explicit: full rip-out, not a flag/gate.

  This is ONE atomic story, not split further, because the pieces are compile-interdependent —
  deleting src/consus-*.ts while bin/minerva.ts still imports from them breaks the build; the
  PlanRequest type change and bin/minerva-plan.ts's call-site fix must land in the same commit
  or the build won't compile in between. No sub-boundary in this list may be split into a
  separate story without leaving an intentionally broken intermediate state.

  ## What to remove (verbatim from the design discussion's resolved decisions — do not re-litigate)

  1. **Delete four modules as one atomic unit**, respecting the consus-poller.ts ->
     consus-resume.ts import dependency (extractAnswerFromItem) — never delete consus-resume.ts
     first and leave consus-poller.ts with a dangling import:
     - src/consus-decisions.ts (+ src/consus-decisions.test.ts)
     - src/consus-poller.ts (+ src/consus-poller.test.ts)
     - src/consus-resume.ts (+ src/consus-resume.test.ts) — also carries a duplicate
       fileStoriesToMultica/fileAllStoriesToMultica implementation; deleting this file removes
       that duplicate "for free," you do not need to touch plan-runner.ts's separate copy.
     - src/consus-auto-resume.ts (+ src/consus-auto-resume.test.ts)

  2. **src/dispatch.ts**: remove the 4 Consus method registrations from the handler map
     (resumeFromConsusAnswer, resumeAnsweredConsusDecision, pollConsusAnswers,
     pollAndResumeConsusAnswers) and their 3 import lines. Leave the 8 provider-neutral methods
     untouched (capabilities, startRun, getRunStatus, listRuns, getQuestions, submitAnswers,
     getOutput, abortRun).

  3. **src/kickoff-engine.ts**: in recordTurn(), delete the call to
     postQuestionToConsusDecisionApi() and the branch that flips status to "awaiting-consus" on
     a truthy result — DELETE the block entirely, do not add a flag/gate around it. recordTurn()
     already forms a complete, correct unit without it (it already calls updateRunRecord with
     status: "waiting_on_human" and the question before the Consus block runs) — deleting the
     Consus block leaves no orphaned variables or dead code.

  4. **src/run-manager.ts**: remove "awaiting-consus" from the RunStatus union type, and remove
     consus_question_id from the Question interface (NOT a top-level RunRecord field — it's
     nested inside RunRecord.questions[]). Do NOT touch defaultSeedRepoPath()'s
     "~/repos/consus-seeds" reference — that's an unrelated seed-repo naming coincidence,
     explicitly out of scope (tracked separately under epic minerva-value-audit).

  5. **src/plan-runner.ts**: delete the unconditional "surface parked questions to Consus" block
     at the end of runHeadlessPlan (the one that POSTs to ${CONSUS_URL}/api/questions regardless
     of any flag). Delete the pollConsusForAnswers-gated poll loop too — nothing is left to poll
     once the dedicated modules are gone. Remove pollConsusForAnswers from the PlanRequest type
     entirely (do not just stop using it — remove the field so TypeScript's excess-property
     check forces bin/minerva-plan.ts's call site to be fixed in this same commit, not silently
     ignored later). Remove the CONSUS_URL env var default and its usage. Leave the Multica CLI
     shell-out surface (_multicaRunner, fileStoriesToMultica, __setMulticaRunnerForTest) —
     Multica is out of scope for this epic (already flag-gated, not the coupling that broke
     tests).

  6. **bin/minerva-plan.ts**: fix the call site that will now fail to compile (it currently
     hardcodes pollConsusForAnswers: true in the runHeadlessPlan({...}) call — remove that field
     from the call). Add a one-line comment directly above the runHeadlessPlan({...}) call
     warning future editors: do not extract this object literal into a variable before passing
     it, doing so would silently defeat TypeScript's excess-property checking that currently
     catches a stale/removed field at compile time (this is the specific fragility the design
     discussion flags — the forcing function only works because the call passes an inline object
     literal directly, not through an intermediate variable).

  7. **bin/minerva.ts**: remove --poll-consus, --poll-and-resume, --consus-item-file from
     mainArgs() and their handling logic, remove the direct Consus module imports. Update the
     ARG_HELP string: `"minerva — JSON-over-stdio by default, plus Consus resume shorthand"`
     becomes `"minerva — JSON-over-stdio"` (or equivalent, matching this file's existing help
     text style). Leave --file-to-multica untouched (opt-in, not part of the Consus coupling).
     This must happen in the SAME commit as step 1 (module deletion) — bin/minerva.ts currently
     imports the modules step 1 deletes, so leaving its imports in place breaks the build
     immediately.

  DO NOT: touch src/agnostic-plan-driver.ts, src/driver.ts, or anything from the
  fix-startrun-heimdall-routing epic this branch is already built on. DO NOT: touch Multica
  logic in plan-runner.ts, consus-resume.ts's Multica functions (deleted wholesale, not
  surgically edited), or bin/ideate-to-consus.mjs (a separate story handles its header-comment
  note). DO NOT: consolidate the duplicate Multica-shell-out implementations — explicitly out of
  scope per the design discussion (§3e), tracked as a future follow-up, not this epic.

acceptance_criteria:
  - "Given the 4 dedicated consus-*.ts modules and their test files, when this story completes, then none of them exist on disk, and no remaining file imports from any of them"
  - "Given src/dispatch.ts, when read after this story, then it registers exactly 8 methods (the original provider-neutral set) and imports nothing from any consus-*.ts module"
  - "Given src/kickoff-engine.ts's recordTurn(), when a question is recorded, then the run's status is set to waiting_on_human and nothing in the function ever references Consus, awaiting-consus, or consus_question_id"
  - "Given src/run-manager.ts, when read, then RunStatus has no 'awaiting-consus' value and Question has no consus_question_id field; defaultSeedRepoPath()'s consus-seeds reference is UNCHANGED (out of scope)"
  - "Given src/plan-runner.ts, when read, then there is no unconditional or flag-gated Consus HTTP call anywhere, no CONSUS_URL reference, and PlanRequest has no pollConsusForAnswers field"
  - "Given bin/minerva-plan.ts, when read, then its runHeadlessPlan({...}) call has no pollConsusForAnswers field and carries the warning comment about not extracting the object literal to a variable"
  - "Given bin/minerva.ts --help (or equivalent invocation), when run, then its output contains no mention of Consus, --poll-consus, --poll-and-resume, or --consus-item-file, and --file-to-multica still works"
  - "Given src/types.test.ts's exhaustive RunStatus switch, when updated in this SAME commit as the run-manager.ts type change, then it compiles and passes with no awaiting-consus branch"
  - "Given src/kickoff-engine.test.ts, when read, then the MINERVA_CONSUS_DECISIONS_URL: \"\" workaround at (formerly) line 344 is removed as dead/meaningless config"
  - "Given src/full-loop.test.ts and src/e2e-auto-resume.test.ts, when this story completes, then they are REWRITTEN (not deleted) to assert the underlying capability (a run pauses to waiting_on_human and resumes via submitAnswers) without any Consus-shaped assertions (no consus.posts.length, no mockConsusServer usage) -- the end-to-end pause/resume capability itself must still have test coverage"
  - "Given bin/minerva.test.ts, when read, then the test asserting pollAndResumeConsusAnswers is a registered ABI method is removed or inverted to assert it is NOT registered"
  - "Given `grep -ril consus src/ bin/` run after this story (case-insensitive), when checked, then the only surviving source-code hits are: bin/ideate-to-consus.mjs (untouched by this story, handled by the sibling docs story), and run-manager.ts's unrelated consus-seeds reference -- nothing else"
  - "Given `npx tsc --noEmit`, when run, then it passes with zero errors"
  - "Given the full test suite (`npm test` or targeted equivalent), when run, then it passes with zero new failures beyond the pre-existing, already-documented ones (live-Consus-service test flakiness this story ELIMINATES should now be gone; the unrelated t-004 plan_runtime bug and any real-subprocess-spawning tests are out of scope)"

