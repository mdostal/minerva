design_decisions:
  - decision: One atomic story covering all of §3(a)-(d), not split by TPM's initial 2-story suggestion
    rationale: "bin/minerva.ts imports the modules this story deletes -- splitting the CLI-flag cleanup into a separate story would leave an intentionally broken intermediate build state between stories, which no Hive story boundary should do. The design discussion's own §3 ordering note and §7 verification plan both already assume same-commit landing for these pieces."
  - decision: Remove pollConsusForAnswers from PlanRequest rather than deprecate/ignore it
    rationale: "Makes bin/minerva-plan.ts's stale call site a compile error (loud, fixed now) instead of a silent no-op (quiet, wrong later) -- this is the epic's own explicitly-designed forcing function (design-discussion.md §3d)"
  - decision: Rewrite full-loop.test.ts/e2e-auto-resume.test.ts rather than delete them
    rationale: "They assert real, valuable end-to-end behavior (does a run actually pause and resume) that predates and is independent of Consus -- deleting them would remove real coverage, not just Consus-specific assertions"

cross_cutting:
  - concern: documentation
    action: "This story does NOT update docs -- that's the sibling story document-consus-ripout-and-standalone-boundary, which depends on this one completing first so it can describe the actual end state accurately"

risks:
  - severity: high
    description: "bin/minerva-plan.ts's hardcoded pollConsusForAnswers:true is the sharpest edge in this epic -- if plan-runner.ts's type change and this file's call-site fix land in separate commits, the build breaks in between (best case) or a stale field silently no-ops (worst case, if TypeScript's excess-property check doesn't fire for some reason)"
    mitigation: "Both changes MUST land in this single story's single commit, verified by acceptance criteria requiring a clean tsc --noEmit at integrate time; the warning comment guards against a FUTURE regression, not this story's own risk"
  - severity: medium
    description: "types.test.ts's exhaustive switch over RunStatus will fail to compile the moment awaiting-consus is removed from the type -- easy to miss if the test-spec step doesn't explicitly include it"
    mitigation: "Explicitly listed as a test-spec step deliverable and an acceptance criterion, not left to be discovered incidentally"

