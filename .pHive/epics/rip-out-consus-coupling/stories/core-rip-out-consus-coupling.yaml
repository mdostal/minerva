steps:
  - id: research
    description: Read src/dispatch.ts, src/kickoff-engine.ts's recordTurn(), src/run-manager.ts's RunStatus/Question types, src/plan-runner.ts's Consus block and pollConsusForAnswers usage, bin/minerva.ts's mainArgs(), bin/minerva-plan.ts's runHeadlessPlan call site, and all 4 consus-*.ts modules plus their test files, to confirm exact line numbers and the consus-poller.ts->consus-resume.ts dependency before making any change.
    agent: researcher
  - id: test-spec
    description: |
      Rewrite src/full-loop.test.ts and src/e2e-auto-resume.test.ts FIRST, before deleting any
      production code, to assert the underlying pause/resume capability (waiting_on_human,
      submitAnswers) without Consus-shaped assertions. Update src/types.test.ts's exhaustive
      switch to drop the awaiting-consus branch. Update bin/minerva.test.ts to remove/invert the
      pollAndResumeConsusAnswers registration assertion. These will fail to compile/run until the
      production code changes land -- that's expected for this step.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Delete the 4 consus-*.ts modules (atomic, respecting the import dependency), and make all the src/dispatch.ts, kickoff-engine.ts, run-manager.ts, plan-runner.ts, bin/minerva.ts, bin/minerva-plan.ts changes described above, in one commit, to make the rewritten tests pass and the build compile.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm the grep-for-consus acceptance criterion holds, confirm no dangling imports, confirm defaultSeedRepoPath()'s consus-seeds reference was left untouched, confirm the full test suite is green with zero new failures, confirm typecheck is clean, confirm bin/ideate-to-consus.mjs was NOT touched (separate story).
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

