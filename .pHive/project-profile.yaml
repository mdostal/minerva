north_star:
  goal: >
    Enable the idea -> plan -> ticket-decomposition -> Multica-execution pipeline to run
    fully asynchronously under agentic harnesses, not just interactive sessions. Minerva's
    scope was always "drive any Hive plugin command headlessly," but the concrete driving
    goal is: fire an idea in, run the Hive commands (kickoff+plan today, any command per
    VISION.md's long-term rungs), pause at a question/decision point, forward that question
    out to whatever is calling Minerva, then resume exactly where it left off once an answer
    comes back -- across any harness that can pause and be picked back up again. With Claude
    this can be as simple as `--resume`, but production issues with that path were the actual
    reason plugin-hive itself is being made runner-agnostic (see agnostic-plan-driver, Heimdall
    route, PAN work in git history).
    OPEN STRATEGIC QUESTION (unresolved, explicitly deferred by the user 2026-08-13): "plugin-hive
    gaining agnostic pause/resume" is not one unified capability -- per minerva-value-audit's
    design-discussion.md (§2), it's three separate efforts at three different maturities: (1)
    upstream `firefly-events/plugin-hive#341`, a file-based headless-question protocol for
    kickoff/plan -- the one Minerva's own ForkedHiveDriver is a working, e2e-tested client of, not
    a bystander waiting on; (2) fork-only runner-agnostic dispatch work (fork PRs #3/#6/#11/#12,
    gated behind fork PR #10 reaching the fork's own main), which is about *which runner* executes
    a step, orthogonal to pause/resume, and is what src/agnostic-plan-driver.ts spawns; and (3) the
    native DAG-executor `pause` node type (shipped, plugin cache v2.15.0), a synchronous
    long-blocking poll loop opt-in per workflow (ui-design/design-review/daily-ceremony only, not
    kickoff/plan) -- architecturally the opposite of Minerva's cold-start-tolerant design. None of
    the three, individually or combined, currently closes the question of whether Minerva remains
    necessary as a separate layer -- that judgment call the user has not yet made. This kickoff
    does not resolve it; future planning/execution work on Minerva should stay aware this question
    is open rather than assume Minerva's continued existence is settled.
  audience: >
    Both the human operator directly, and other Pantheon services (invoked as a plugin via
    Auriga-style routing). Unchanged from the original kickoff, but sharpened 2026-08-13:
    Minerva itself must stay harness/UI-agnostic -- it provides the pause/resume/question-
    extraction *capability* only. It does not know about, integrate with, or surface anything
    through Consus (Pantheon's renamed Delphi) or any other specific UI. When Minerva runs as
    a Pantheon plugin, surfacing questions through Consus (or any other surface) is entirely
    Pantheon/the calling integration's responsibility -- never Minerva's concern.
  expected_scale: "Low concurrency per instance, but must support spinning up many separate Minerva instances in parallel (one per repo / one per idea-intake session) so a person can push many ideas through at once instead of hand-running kickoff+plan per idea in separate terminals."
  pain_points: >
    (1) Manual per-idea kickoff -- historically meant SSHing into a box and hand-running the
    flow per idea, which doesn't scale.
    (2) Needs to run asynchronously, without an SSH session, with compute pushed onto other
    boxes via Multica -- Minerva should be the persona/toolset that drives Hive commands
    remotely on Multica-managed compute.
    (3) Prior attempts at simple session-resume (e.g. Claude's own --resume) hit real
    production issues when moving from a normal interactive session to agentic-tool-driven
    pause/resume; the fix in progress is making plugin-hive itself fully runner-agnostic
    (agnostic-plan-driver + Heimdall route, landed 2026-08-12) -- which is also what raises
    the open strategic question above about whether Minerva remains necessary as a separate
    layer once that agnosticism is complete. Note this is distinct from the ForkedHiveDriver/
    PR #341 dependency below: agnostic-plan-driver's runner selection and ForkedHiveDriver's
    question/pause protocol are two of the three separate plugin-hive efforts referenced above,
    not the same thing.
    (4) ForkedHiveDriver's intended production path (MINERVA_HIVE_PLUGIN_DIR unset, relying on
    a marketplace-installed plugin-hive) does not yet carry PR #341's protocol because #341 is
    still unmerged upstream -- see docs/decisions/002-pr341-production-dependency.md for the
    full gap and its recheck date. Both places this used to fail silently now emit a structured
    WARN-level stderr log instead (agnosticPlanCliPath()'s no-candidate-path fallback in
    src/agnostic-plan-driver.ts, and ForkedHiveDriver.surfaceNextQuestion()'s zero-pending-
    envelope case in src/driver.ts) -- observability only, the underlying fallback behavior is
    unchanged, but it's no longer silent.
  success: >
    Drop an idea in; Minerva runs the relevant Hive command(s) headlessly and, at any
    question/decision point, pauses and hands the extracted question(s) back to whoever
    called it -- without assuming or building any specific answer-surface itself. The caller
    (a human session, or Pantheon via Consus, or any other agentic harness) decides how to
    collect the answer and hands it back to Minerva to resume from exactly where it paused.
    Once a run completes, it feeds scope/tickets forward into Multica so the pipeline keeps
    going -- fully async, multi-instance, no manual babysitting, and no coupling to any one
    downstream surface.
  avoid: >
    Never auto-approve. Minerva must not make assumptions, cut corners, or kick off work when
    uncertain or under-informed -- it should keep building out the full requirements until
    there's enough to proceed. A real approval process (human, or via the votem plugin) sits
    in front of every kickoff, configured outside Minerva itself.
    Also avoid: Minerva taking on integration or UI responsibility that belongs to the calling
    harness. It must not hardcode or assume Consus (or any other specific surface) as the
    place questions get answered -- that coupling belongs entirely to Pantheon/the integration,
    never to Minerva.

