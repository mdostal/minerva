project_name: "minerva"
type: brownfield
discovered: "2026-08-13"
source: "CLAUDE.md absent; README.md + VISION.md + docs/ + codebase scan (re-kickoff from greenfield 2026-07-24)"

project_type: service
has_ui: false

ship_target:
  kind: custom
  command: "git tag -a v{version} -m 'Minerva v{version}' && git push origin v{version}"
  notes: >
    Git-dependency model, decided 2026-07-26: Auriga/Vulcan reference Minerva via a git
    URL (pinned to a tag) in their own package.json, not an npm registry -- no internal
    registry exists yet, and this keeps everything local. Public-registry npm publish is
    deferred to a future explicit decision (Mathew), not automatic. The ship action is
    just cutting and pushing the release tag other repos pin against.

tech_stack:
  languages:
    - typescript
  frameworks: []
  build_tools:
    - tsx
    - typescript
  package_managers:
    - npm
  versions:
    node: ">=20.19"
    typescript: "^5.7.0"
    tsx: "^4.23.1"

claude_md_summary: |
  No CLAUDE.md yet. Project conventions so far (from README.md / VISION.md / docs/):
  - TS by default (ES2022, NodeNext, strict, noUncheckedIndexedAccess); Pantheon subprocess ABI is interchangeable/any-language.
  - Full TDD discipline: named -> interfaced -> full TDD -> locked. Near-1:1 test-to-source ratio (22 test files / 21 source files), co-located *.test.ts.
  - Test runner is Node's native node:test via `tsx --test` (not Jest/Vitest) -- forced single-concurrency + force-exit because tests spawn real subprocesses.
  - `npm run ci` (test + typecheck) is the authoritative local gate; .github/workflows/{ci,promote}.yml are Pantheon's shared cross-repo scaffolding layered on top, not app-specific.
  - No lint/format/pre-commit tooling configured yet -- tsc --strict + tests are the only quality gate.
  - Fail-loud discipline: invalid config (e.g. MINERVA_DRIVER, MINERVA_TURN_TIMEOUT_MS) throws rather than silently defaulting.
  - Rogue-overwrite guardrails expected.
  - Minerva is headless: it drives the Hive plugin commands (kickoff+plan today; VISION.md scopes it toward any Hive command) via a JSON-over-stdio subprocess ABI, park/resume at breakpoints, no daemon -- state lives on the filesystem under ~/.minerva/runs. It is not wired into a specific UI surface (e.g. Delphi/Consus); the human/agent surface is whatever harness calls it.

discovery_brief: "docs/initial-info.md"  # resolved/refined source of truth: v1 = agent-drivable, standalone; Delphi/Auriga/Vulcan/Multica/votem are v2 behind contracts

structure:
  modules:
    - name: dispatch
      purpose: "Flat method-registry dispatcher (capabilities, startRun, getRunStatus, listRuns, getQuestions, submitAnswers, getOutput, abortRun) -> {result}/{error} envelope"
      source: src/dispatch.ts
    - name: kickoff-engine
      purpose: Drives plugin-hive's kickoff+plan skills headlessly
      source: src/kickoff-engine.ts
      tests: src/kickoff-engine.test.ts
    - name: plan-runner
      purpose: Runs the PLAN driver, files decomposed stories into the seed's target project, carries depends_on
      source: src/plan-runner.ts
      tests: src/plan-runner.test.ts
    - name: agnostic-plan-driver
      purpose: Runner-agnostic PLAN driver with Heimdall route + bulletproof claude fallback (newest subsystem)
      source: src/agnostic-plan-driver.ts
      tests: src/agnostic-plan-driver.test.ts
    - name: driver
      purpose: "Swappable Driver abstraction (single runTurn method): SpawnDriver (default, claude -p/--resume, real SIGINT/SIGTERM hardening), SubagentDriver (claude --bg + poll + stop + resume), ForkedHiveDriver (fully implemented, e2e-tested (PAN-8613/PAN-8619); Minerva's own working client of plugin-hive PR #341's headless-question protocol -- see docs/decisions/002-pr341-production-dependency.md for the one real gap: its intended production path, MINERVA_HIVE_PLUGIN_DIR unset against a marketplace-installed plugin-hive, doesn't carry the protocol until PR #341 merges; only the MINERVA_HIVE_PLUGIN_DIR local-fork-checkout testing path has been exercised end-to-end)"
      source: src/driver.ts
      tests: src/driver.test.ts, src/driver-sigint-harness.ts, src/subagent-driver-sigkill-harness.ts
    - name: run-manager
      purpose: Per-run isolated git workspace management under ~/.minerva/runs; getRunStatus/listRuns
      source: src/run-manager.ts
      tests: src/run-manager.test.ts
    - name: repo-resolution
      purpose: Resolve/stamp the real target repo per seed (worktree from dev branch, or fresh git init for greenfield)
      source: src/repo-resolution.ts, src/target-repo-signal.ts
      tests: src/repo-resolution.test.ts, src/target-repo-signal.test.ts
    - name: envelope-detection
      purpose: Read-only detection of .pHive/questions/*.yaml structured envelopes
      source: src/envelope-detection.ts
      tests: src/envelope-detection.test.ts
    - name: escalation-classification
      purpose: Classifies extracted questions agent vs human channel
      source: src/escalation-classification.ts
      tests: src/escalation-classification.test.ts
    - name: question-extraction
      purpose: Pulls a turn's question via constrained --json-schema call
      source: src/question-extraction.ts
      tests: src/question-extraction.test.ts
    - name: completeness / deadline-renewal-ownership
      purpose: Governance around when a run is "done enough" / renewal ownership rules
      source: src/completeness.test.ts, src/deadline-renewal-ownership.test.ts
    - name: output-emitter
      purpose: Emits approved epic/stories; detects flat + multi-epic plugin-hive layout to auto-fire filing
      source: src/output-emitter.ts
      tests: src/output-emitter.test.ts
    - name: cleanup-ledger
      purpose: Append-only ledger for external GC -- Minerva itself never deletes a workspace
      source: src/cleanup-ledger.ts
      tests: src/cleanup-ledger.test.ts
    - name: plan-defaults
      purpose: Pre-baked default answers so headless plan runs don't hang
      source: src/plan-defaults.ts
      tests: src/plan-defaults.test.ts, src/prebaked-plan-defaults.test.ts
    - name: shared-contracts
      purpose: Shared capability/error contract types
      source: src/capabilities.ts, src/errors.ts, src/types.test.ts
    - name: test-cli
      purpose: Shared in-house test harness (call()) used across most *.test.ts files
      source: src/test-cli.ts
  entry_points:
    - bin/minerva.ts        # ABI entry: reads one JSON request from stdin, dispatches, writes response, exit 0/1
    - bin/minerva-plan.ts   # Auriga-invokable direct plan entry point
    - bin/ideate-to-consus.mjs  # ideation loop (idea -> questions+wireframe+PRD -> Consus), --scan autopilot/auto-resume

architecture:
  pattern: "Flat method-registry dispatch + swappable Driver strategy abstraction; no framework, no DI container"
  di_framework: "manual (plain function imports wired directly into dispatch registry)"
  state_management: "Filesystem-only, no DB, no server/port -- per-run state under ~/.minerva/runs; no daemon, every dispatch is a fresh process"
  navigation: "N/A (headless subprocess ABI, not a UI)"
  data_layer: "JSON-over-stdio request/response envelope ({result}/{error}); MinervaError typed with ErrorCode union"

conventions:
  naming: "kebab-case .ts files; *.test.ts co-located with source; *-harness.ts suffix for standalone empirical-proof scripts (e.g. signal-handling)"
  file_organization: "Flat src/ (no subdirectories), 1:1 co-located tests, bin/ for process entry points"
  branching: "feat/<slug-or-ticket> (e.g. feat/PAN-8562), generated run/<uuid> and recovered/<sha> branches from Minerva's own dogfooded runs; main + dev both long-lived, dev -> main via promote.yml"
  commit_messages: "Conventional Commits (feat(scope):, fix(scope):, docs:, ci:), often referencing Linear ticket IDs (PAN-6745, pan-6965) and epic/story bracket tags"

test_infrastructure:
  unit:
    framework: "Node native node:test via tsx --test"
    location: "src/**/*.test.ts, bin/**/*.test.ts (co-located, no separate test dir)"
    count: "22 test files vs 21 non-test source files -- near 1:1"
    coverage_tool: none
  integration:
    framework: "Same node:test harness; several tests spawn real subprocesses/child processes (hence --test-concurrency=1 --test-force-exit)"
    location: src/*.test.ts
  e2e:
    framework: none
    location: null
    count: 0
  mocking: "None -- no mocking library; tests exercise real subprocess/filesystem behavior via the shared src/test-cli.ts call() harness"
  test_commands:
    - "npm test"
    - "npm run typecheck"
    - "npm run ci"

ci_cd:
  platform: "GitHub Actions"
  workflows:
    - name: ci.yml
      purpose: "Standard reusable Pantheon-wide gate: auto-detects stack (node/python/go), runs install+build+test on PRs into dev/main/master + workflow_dispatch"
    - name: promote.yml
      purpose: "On push to dev, opens (or idempotently reuses) a dev -> default-branch PR; deliberately does not auto-merge so GITHUB_TOKEN can't bypass the CI gate on bot-opened PRs"
  gating: "npm run ci (test + typecheck) is the authoritative app-level gate; the two workflows above are shared Pantheon scaffolding layered on top, not Minerva-specific"

