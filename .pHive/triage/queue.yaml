    closed_reason: "shipped in PR #2 (epic swappable-driver, v0.1.1) -- Driver abstraction, SpawnDriver hardening (SIGINT/SIGTERM, configurable turn timeout), locked core types, and the ForkedHiveDriver seam all merged to origin/dev before this session began. Discovered stale (still plan-ready) during a 2026-08-14 backlog sweep; closing as bookkeeping, no further work needed."
