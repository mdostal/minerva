  - id: t-006
    state: closed
    kind: bug
    title: "Broad test-suite flakiness on this dev machine: 10-17 live-subprocess/timing-sensitive tests fail under a full `npm test` run, unrelated to any code change"
    description: |
      Surfaced while verifying story remove-ideate-to-consus-tool (epic remove-ideate-to-consus,
      t-005) was clean before commit. A full `npm test` run showed 17 failures out of 209/201
      tests; re-running just the 4 affected files in isolation (deadline-renewal-ownership.test.ts,
      kickoff-engine.test.ts, prebaked-plan-defaults.test.ts, run-manager.test.ts) still showed
      10/29 failures, with individual test durations of 13-47 seconds -- these spawn real `claude`
      subprocesses / hit real timing windows rather than running hermetically.

      Confirmed NOT caused by the remove-ideate-to-consus change: none of the failing files
      (src/deadline-renewal-ownership.test.ts, src/kickoff-engine.test.ts,
      src/prebaked-plan-defaults.test.ts, src/run-manager.test.ts, src/driver.test.ts,
      src/real-forked-hive-driver.test.ts, src/plan-runner.test.ts) import or reference
