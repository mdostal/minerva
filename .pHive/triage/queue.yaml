  - id: t-006
    state: inbox
    kind: bug
    title: "Broad test-suite flakiness on this dev machine: 10-17 live-subprocess/timing-sensitive tests fail under a full `npm test` run, unrelated to any code change"
    description: |
      Surfaced while verifying story remove-ideate-to-consus-tool (epic remove-ideate-to-consus,
      t-005) was clean before commit. A full `npm test` run showed 17 failures out of 209/201
      tests; re-running just the 4 affected files in isolation (deadline-renewal-ownership.test.ts,
      kickoff-engine.test.ts, prebaked-plan-defaults.test.ts, run-manager.test.ts) still showed
      10/29 failures, with individual test durations of 13-47 seconds -- these spawn real `claude`
      subprocesses / hit real timing windows rather than running hermetically.

      Confirmed NOT caused by the remove-ideate-to-consus change: none of the failing files
      (src/deadline-renewal-ownership.test.ts, src/kickoff-engine.test.ts,
      src/prebaked-plan-defaults.test.ts, src/run-manager.test.ts, src/driver.test.ts,
      src/real-forked-hive-driver.test.ts, src/plan-runner.test.ts) import or reference
      bin/ideate-to-consus.mjs, docs/ideation/*, or tests/e2e/ForkedDriverFlow.test.ts (grep-
      confirmed) -- ideate-to-consus.mjs was a standalone CLI entrypoint with no importers.

      Two of the 17 are already t-004 (kickoff-engine.test.ts plan_runtime='gemini' tests).
      The rest are new observations, not yet individually root-caused:
      - src/deadline-renewal-ownership.test.ts: "an answer submitted long after the envelope's
        on-disk deadline has lapsed still lands correctly" -- 42s duration, real-time-window test.
      - src/driver.test.ts: "SIGINT to a live SpawnDriver-driven process kills the in-flight
        claude child -- no orphan" -- spawns a real subprocess.
      - src/prebaked-plan-defaults.test.ts: ~8 failures across auto/agent-mode headless-plan tests
        -- likely depends on live Heimdall/claude routing, same category as t-003's root cause.
      - src/real-forked-hive-driver.test.ts: 2 failures on real multi-turn dispatch/closure tests.
      - src/run-manager.test.ts / src/plan-runner.test.ts: listRuns / workspace-isolation tests --
        one of these was already noted as a "confirmed-transient" flake earlier this session.

      Working hypothesis (not yet verified): most of these need a live Heimdall instance and/or a
      real `claude` CLI runtime to behave deterministically -- the same underlying environment gap
      that motivated t-003/fix-startrun-heimdall-routing, just hitting more test files than
      startRun alone. Needs a proper /plan cycle to confirm root cause per file and decide fix
      (better test isolation/mocking vs. documenting a required local dev environment).

      Not resolved by this triage entry -- filed so it surfaces at standup rather than getting
      lost. Did not block story remove-ideate-to-consus-tool: that change is structurally unrelated
      (no import chain to any affected file) and typecheck + the specifically-touched test file
      (ForkedDriverFlow.test.ts) both passed clean in isolation.
    reporter: "mdostal"
