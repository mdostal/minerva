  - id: t-007
    state: closed
    kind: feature
    title: "No test coverage for resolveAgnosticPlanDriver's actual positive path (picking a non-claude Heimdall-routed runtime) -- only the null-return guards are tested"
    description: |
      Surfaced while root-causing t-004. src/agnostic-plan-driver.ts's resolveAgnosticPlanDriver()
      has 5 short-circuit-to-null guards (feature off, test mode, unreachable/claude route, missing
      ported CLI, missing opencode binary) but the actual success path -- constructing a real
      AgnosticPlanDriver from a resolved non-claude route -- has zero test coverage anywhere.
      agnostic-plan-driver.test.ts only covers 2 of the 5 guards (test mode, feature off).
      kickoff-engine.test.ts's two plan_runtime tests (fixed via t-004) can never reach this path
      either, since that file's fixture always sets MINERVA_TEST_DRIVE_PROMPT.

      Blocker: agnosticPlanCliPath() and opencodeAvailable() (agnostic-plan-driver.ts:36,70) have
      no dependency-injection seam -- they hit the real filesystem / spawn a real `opencode
      --version` check. A clean unit test needs either (a) a DI refactor to inject these as
      parameters/overridable functions, or (b) an environment-gated live integration test (skip
      unless a real ported CLI + opencode are present on the test machine, similar to other
      live-driver tests in this repo).

      Not investigated further -- filed so it surfaces at standup. Needs a /plan cycle to pick the
      approach (DI refactor vs. gated live test) once picked up.

      CORRECTION (2026-08-14T20:15Z): this triage entry was factually wrong. Before starting the
      DI refactor the operator approved, a final check of src/full-loop.test.ts (a sibling file
      from the separate minerva-value-audit epic, not cross-referenced when this was filed) showed
      its "full autonomous loop: claude kickoff + gemini planning" test already exercises exactly
      this positive path: a mocked Heimdall route returning a non-claude runtime, a real
      HIVE_PLAN_AGNOSTIC_CLI override pointing at a real executable fake CLI, OPENCODE_BIN=echo
      satisfying opencodeAvailable(), and an assertion that record.plan_runtime === "gemini" /
      plan_model === "gemini-2.0-flash-exp". Confirmed passing (npx tsx --test
      src/full-loop.test.ts, both tests ok) and has been passing all night -- never appeared in
      any failure list across every test run tonight. agnosticPlanCliPath()/opencodeAvailable()
      already have working override seams (HIVE_PLAN_AGNOSTIC_CLI, OPENCODE_BIN); no DI refactor
      is needed or was built. Closing as a filing error, not a shipped fix -- the root mistake was
      only checking agnostic-plan-driver.test.ts and kickoff-engine.test.ts for coverage during
      t-004's investigation, not the full test suite.
    reporter: "mdostal"
