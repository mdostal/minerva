  - id: t-004
    state: closed
    kind: bug
    title: "kickoff-engine.test.ts: two tests expect frozen plan_runtime='gemini' but get undefined -- reproduced twice, independent of the Heimdall startRun fix"
    description: |
      Confirmed reproducible twice in this session, with identical details both times (once
      before epic fix-startrun-heimdall-routing existed, once after it shipped and fixed the
      unrelated startRun/UNKNOWN_METHOD/task-type/orphan-cleanup issues) -- so this is a distinct,
      stable, pre-existing bug on dev, not caused by or fixed by that epic.

      Failing tests (src/kickoff-engine.test.ts):
      - "planning route freezes on run record when Heimdall returns a non-claude runtime"
        (kickoff-engine.test.ts:196) -- expects record.plan_runtime === 'gemini', gets undefined.
      - "submitAnswers keeps the frozen plan_runtime (no drift) and falls back correctly if CLI is
        missing" (kickoff-engine.test.ts:244) -- same expected/actual mismatch.

      Both tests spin up their own hermetic mock Heimdall server (createMockHeimdall(), a real
      local HTTP server via node -e, no external dependency) and set MINERVA_HEIMDALL_URL /
      MINERVA_HEIMDALL_AVAILABLE_ROUTE_URL to point at it -- they are NOT the seed-repo issue, NOT
      the live-Consus-service issue (t-002), and NOT anything touched by
      fix-startrun-heimdall-routing's 4 stories (which fixed resolveRuntimeRoute()'s error
      handling and availableRouteUrl()'s task-type value, not the plan_runtime-freezing logic this
      test exercises). Given they mock Heimdall themselves, the failure is very likely in
      Minerva's own plan_runtime-freezing code path (wherever `record.plan_runtime` gets set from
      the resolved route), not an environment/reachability problem.

      ROOT CAUSE FOUND (2026-08-14T18:10Z): not a bug in the freezing code path -- the two tests
      are stale against a deliberate, documented guard added by the runner-agnostic PLAN driver
      work (commit 9b79947, PR #22, merged to main just before this session's kickoff).
      src/agnostic-plan-driver.ts:112: `if (process.env.MINERVA_TEST_DRIVE_PROMPT) return null;`
      -- a "bulletproof claude fallback" test seam (comment: "the automated suite injects a fake
      driver and swaps the drive prompt; never reach for the network or a real runtime there").
      kickoff-engine.test.ts's env() helper sets MINERVA_TEST_DRIVE_PROMPT unconditionally for
      EVERY test in the file (needed to keep its real `claude -p` subprocess spawns cheap/
      scripted) -- so resolveAgnosticPlanDriver() always short-circuits to null before ever
      reaching Heimdall's mocked route, and kickoff-engine.ts:297 never sets plan_runtime/
      plan_model, regardless of what the mock Heimdall server returns. The sibling tests
      expecting `plan_runtime === undefined` ("falls back to claude", "stays absent when Heimdall
      explicitly returns claude") pass trivially -- that's the ONLY reachable behavior in this
      file's fixture now. This also means real positive-path coverage (resolveAgnosticPlanDriver
      actually picking a non-claude runtime) has a genuine gap: agnostic-plan-driver.test.ts only
      covers the two null-return guards (test mode, feature off), never the actual resolution
      path, because exercising it needs a real ported CLI + opencode binary on disk with no
      dependency-injection seam to fake them.

      DECISION: scope is now small and unambiguous -- fix the two stale test expectations to
      match the deliberately-guarded current behavior (rewrite, not delete, so the guard itself
      stays regression-tested); file the deeper positive-path coverage gap as its own follow-on
      triage item (t-007) rather than pulling a DI refactor into this fix. Fast-tracked to
      plan-ready; executing directly, no research-brief/grill ceremony, consistent with t-005.
    reporter: "mdostal"
    reported_at: "2026-08-14T05:26:55Z"
    priority: p2
    severity: low
