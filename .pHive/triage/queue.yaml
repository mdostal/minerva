  - id: t-005
    state: closed
    kind: feature
    title: "Remove bin/ideate-to-consus.mjs -- the idea<->Consus round-trip loop belongs in the Pantheon layer, not in Minerva"
    description: |
      Follow-on to t-002/epic rip-out-consus-coupling. That epic ripped Consus coupling out of
      Minerva's core ABI/engine/CLI but deliberately kept bin/ideate-to-consus.mjs as an
      excluded-but-present sibling utility (header note only), since its whole purpose is a
      Consus/Janus round-trip and it sits outside the standalone-core claim.

      Operator directive (2026-08-14): "the ideas from consus to minerva and back and forth is a
      layer living in the pantheon for a decision surface to be able to be made visible and the
      plugins work it, i'll navigate that soonish." This reframes the ideation<->decision-surface
      loop as Pantheon-owned integration glue, not something that should live inside Minerva's
      repo at all -- even as an excluded, opt-in sibling script. Full removal, not just a
      boundary note.

      Scope (confirmed via grep, read-only):
      - bin/ideate-to-consus.mjs (634 lines) -- the tool itself, no dedicated test file.
      - docs/ideation/pan-6965/* and docs/ideation/pan-6963/ingested-context.md -- demo artifacts
        generated by the tool; dead weight once the tool that produced/consumes them is gone.
      - tests/e2e/ForkedDriverFlow.test.ts -- two dead MINERVA_CONSUS_DECISIONS_URL env var
        references (save/clear-for-test/restore triple); confirmed zero remaining reads of that
        env var anywhere in src/ or bin/ after the earlier rip-out, so this is inert leftover, not
        live coupling.
      - CHANGELOG.md's existing Unreleased entry for rip-out-consus-coupling describes
        ideate-to-consus.mjs as "excluded via header note" -- now stale, needs amending (nothing
        released yet, so amend in place rather than layering a contradicting bullet).

      Explicitly NOT in scope (confirmed read-only, not part of this loop):
      - src/run-manager.ts's defaultSeedRepoPath() / "consus-seeds" default git remote naming --
        a seed-repo template naming convention, not a live Consus API call or part of the
        ideation<->decision-surface round trip this item is about.
      - VISION.md / README.md's "Delphi / Consus (human decision surface)" mentions -- these
        correctly describe the wider Pantheon diagram (an external consumer of Minerva's generic
        waiting_on_human/submitAnswers channel), which is exactly the operator's stated target
        shape ("layer living in the pantheon"), not Minerva-side coupling code.
      - .pHive/epics/minerva-auto-resume/* and .pHive/epics/fix-route-response-contract/* --
        historical, already-merged epic docs; kept as history per the same convention used for
        rip-out-consus-coupling's own docs.

      DECISION: scope is small, unambiguous, and fully operator-directed in chat -- executing
      directly (no research-brief/grill ceremony) rather than spinning up full planning agents,
      consistent with how t-002's DECISION note was handled. Fast-tracked straight to plan-ready.
